<!doctype html>
<html lang="zh-CN" data-ui-language="__WB_UI_LANGUAGE__">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>WorkBuddy 用量看板</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d1117'/%3E%3Cpath d='M16 6.5l7 2.9v6.1c0 4.4-2.9 7.6-7 9-4.1-1.4-7-4.6-7-9v-6.1z' fill='none' stroke='%232fd4c4' stroke-width='2.1' stroke-linejoin='round'/%3E%3Cpath d='M12.7 15.8l2.5 2.5 4.3-4.7' fill='none' stroke='%232fd4c4' stroke-width='2.1' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <script>
      (() => {
        try {
          const preference = localStorage.getItem("wb-theme") || "dark";
          const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const dark = preference === "dark" || (preference === "system" && systemDark);
          const root = document.documentElement;
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.themePref = preference;
          root.classList.toggle("dark", dark);
          root.style.colorScheme = dark ? "dark" : "light";
        } catch {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
